name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore TgBroadcast.sln
      - name: Test with temporary SQLite and mocked Telegram
        run: dotnet test TgBroadcast.sln --configuration Release --no-restore --logger trx
      - name: Verify EF migrations
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/TgBroadcast --configuration Release --no-build
      - name: Build container and initialize SQLite without network
        run: |
          docker build -t tgbroadcast-ci .
          docker run --rm --network none tgbroadcast-ci --init-db
